name: browser_surface
description: Presents frames from roscord's out-of-process CEF host as Flutter textures.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: BrowserSurfacePlugin
      windows:
        pluginClass: BrowserSurfacePluginCApi
